[package]
name = "cmqt-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Status board server: dashboards + VictoriaMetrics in, MQTT topics out"

[dependencies]
cmqt = { path = "../cmqt", features = ["client"] }
rumqttc = { version = "0.25", features = ["websocket", "use-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }

[lints]
workspace = true

[dev-dependencies]
rumqttc = { version = "0.25", features = ["websocket", "use-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
