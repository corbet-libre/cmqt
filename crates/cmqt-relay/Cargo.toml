[package]
name = "cmqt-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "cmqt flush and cmqt unseal: one-way sealed-UDP relay of OTLP metrics from RabbitMQ to VictoriaMetrics"

[[bin]]
name = "cmqt"
path = "src/main.rs"

[dependencies]
chacha20poly1305 = "0.11.0"
flate2 = "1.1.11"
futures-lite = "2.6.1"
lapin = "4.12.3"
prost = "0.14.6"
rand = "0.10.3"
rumqttc = { version = "0.25", features = ["websocket", "use-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "signal"] }
toml = "1.2.1"
ureq = "3"
zstd = "0.14.4"

[lints]
workspace = true
