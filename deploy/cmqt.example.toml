# cmqt-server configuration (example).

# cgrf output: manifest.json, internal/<screen>.json, public/<screen>.json
dashboards_dir = "/var/lib/obs/dashboards"
# VictoriaMetrics on the observability box; local only.
victoria_url = "http://127.0.0.1:8428"
# Mosquitto's loopback listener (section 1 of mosquitto.conf).
broker_host = "127.0.0.1"
broker_port = 1883
# Equals vmalert's evaluation interval.
interval_s = 30
# cprm output. When set, its generation must equal the dashboards' generation,
# otherwise _online says "generation-mismatch" and no tile values go out.
prometheus_manifest = "/var/lib/obs/prometheus/manifest.json"
# Optional: a check of the alert path itself. Any series in its result marks _online degraded ("check"), a failing
# query marks it "check-error"; the relay's watcher pages on both through ntfy directly (Alertmanager may be what is
# broken). The example below is valid ONLY once Alertmanager is scraped under the job label "alertmanager": before
# that, absent(up{job="alertmanager"}) is always true and the box would be degraded, and paged, for good.
# degraded_query = 'up{job="alertmanager"} == 0 or absent(up{job="alertmanager"}) or increase(vmalert_alerts_send_errors_total[10m]) > 0'
