# Example Mosquitto configuration for the status board (contract §5, D26).
#
#   cmqt-server --(loopback)--> [1883]  Mosquitto  --> [9001] public WebSocket   (mount public/)
#                                                  --> [8883] internal MQTT/TLS  (mount internal/)
#                                                  --> [8884] internal WebSocket/TLS (mount internal/)
#
# Paths below are examples; adjust them to the host.

# Every listener has its own mount point, ACL and authentication. Without this
# line the settings below would be global and the trees could not be separated.
per_listener_settings true

# No persistence: cmqt-server republishes everything on (re)connect, and a
# restart must never bring back old values. Retained messages also carry a
# message expiry, so nothing old can outlive 3 x interval.
persistence false

# Log to the journal only.
log_dest stderr
log_type error
log_type warning

# ---------------------------------------------------------------------------
# 1. Local listener: cmqt-server only. Loopback, so anonymous access is safe
#    and needs no certificate. It is the only listener that may write, and it
#    sees both trees as public/... and internal/...
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true
# Two retained trees of a few hundred small messages each.
message_size_limit 262144

# ---------------------------------------------------------------------------
# 2. Public listener (status.corbet.ch). Plain WebSocket on loopback: the
#    reverse proxy in front terminates TLS and offers wss://<host>. To let
#    Mosquitto do TLS itself, add cafile/certfile/keyfile as in section 3.
listener 9001 127.0.0.1
protocol websockets
# Clients see <screen>/<tile>; the broker maps that to public/<screen>/<tile>.
# It cannot reach anything outside the public tree.
mount_point public/
# Anonymous visitors, read-only (see public.acl).
allow_anonymous true
acl_file /etc/mosquitto/public.acl
# Cap what a flood of visitors can cost: connections, packet size, queues.
max_connections 500
message_size_limit 65536
max_packet_size 65536
max_queued_messages 200
max_inflight_messages 20
# A client that has not answered for this long is dropped, freeing the slot.
max_keepalive 120

# ---------------------------------------------------------------------------
# 3. Internal listener, MQTT over TLS (status.corbet.internal, kiosk renderer).
listener 8883
protocol mqtt
mount_point internal/
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.3
# Only holders of a client certificate signed by our CA may connect. There are
# no passwords: the certificate is the credential (circle of trust).
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /etc/mosquitto/internal.acl
max_connections 100
message_size_limit 65536

# ---------------------------------------------------------------------------
# 4. Internal listener, WebSocket over TLS (browsers on the internal door).
#    Same rules as section 3.
listener 8884
protocol websockets
mount_point internal/
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.3
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /etc/mosquitto/internal.acl
max_connections 100
message_size_limit 65536
